providers:
  coolify:
    url: "${COOLIFY_URL}"
    api_token: "${COOLIFY_API_TOKEN}"
    server_uuid: "${COOLIFY_SERVER_UUID}"
    project_uuid: "${COOLIFY_PROJECT_UUID}"

projects:
  coolify-example:
    provider: coolify
    repository:
      provider: github
      url: https://github.com/acme/example
    profiles:
      production:
        domain: app.example.com
