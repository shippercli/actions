providers:
  coolify:
    url: "${COOLIFY_URL}"
    api_token: "${COOLIFY_API_TOKEN}"
    server_uuid: "${COOLIFY_SERVER_UUID}"
    project_uuid: "${COOLIFY_PROJECT_UUID}"
  cpanel:
    host: "${CPANEL_HOSTNAME}"
    port: ${CPANEL_PORT}
    username: "${CPANEL_USERNAME}"
    api_token: "${CPANEL_API_TOKEN}"

projects:
  coolify-example:
    provider: coolify
    repository:
      provider: github
      url: https://github.com/acme/example
    profiles:
      production:
        domain: app.example.com
  app:
    provider: cpanel
    path: "."
    web_directory: /public
    profiles:
      production:
        branch: main
        domain: "app.example.com"
        deploy_path: "/app"
        runtime:
          type: php
          version: "8.4"
          install_dependencies: true
        cpanel:
          domain_type: existing
          backup_before_deploy: true
          release_retention: 5
