name: Composite Action CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test organization CI health fixtures
        run: |
          ./scripts/test-org-ci-health.sh
          python3 scripts/test-org-ci-auth.py
      - name: Validate reusable workflow contract
        run: |
          ruby - <<'RUBY'
          workflow = File.read('.github/workflows/shipper.yml')
          provider_secrets = %w[CPANEL_API_TOKEN FORGE_API_TOKEN PLOI_API_KEY COOLIFY_API_TOKEN]

          provider_secrets.each do |secret|
            declarations = workflow.scan(/^      #{secret}:$/).length
            environments = workflow.scan(/^          #{secret}: \$\{\{ secrets\.#{secret} \}\}$/).length
            raise "#{secret} must be declared exactly once" unless declarations == 1
            raise "#{secret} must be forwarded by all three jobs" unless environments == 3
          end

          pins = workflow.scan(%r{uses: shippercli/actions/\.github/actions/shipper@([^\s]+)}).flatten
          raise 'expected validate, plan, and deploy action invocations' unless pins.length == 3
          raise 'action references must use immutable 40-character SHAs' unless pins.all? { |pin| pin.match?(/\A[0-9a-f]{40}\z/) }
          RUBY
      - name: Install and validate with cPanel provider
        uses: ./.github/actions/shipper
        with:
          command: validate
          working-directory: .github/actions/shipper/fixtures
          cli-version: "^1.0"
          providers: |
            shippercli/provider-cpanel:^1.0
        env:
          CPANEL_HOSTNAME: cpanel.example.com
          CPANEL_PORT: 2083
          CPANEL_USERNAME: action-test
          CPANEL_API_TOKEN: action-test-token
      - name: Verify CLI is available to subsequent steps
        run: |
          shipper --version
          command -v shipper > "$RUNNER_TEMP/first-shipper-bin"
      - name: Reinstall with the same Composer constraints
        uses: ./.github/actions/shipper
        with:
          command: validate
          working-directory: .github/actions/shipper/fixtures
          cli-version: "^1.0"
          providers: |
            shippercli/provider-cpanel:^1.0
        env:
          CPANEL_HOSTNAME: cpanel.example.com
          CPANEL_PORT: 2083
          CPANEL_USERNAME: action-test
          CPANEL_API_TOKEN: action-test-token
      - name: Verify identical constraints did not reuse the installed CLI
        run: |
          test "$(command -v shipper)" != "$(cat "$RUNNER_TEMP/first-shipper-bin")"
          shipper --version

  tagged-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register provider repositories
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSER_HOME="$(mktemp -d "${RUNNER_TEMP}/shipper-composer.XXXXXXXX")"
          for provider in forge ploi coolify; do
            composer config --global "repositories.shipper-${provider}" git "https://github.com/shippercli/provider-${provider}.git"
          done
          printf 'COMPOSER_HOME=%s\n' "$COMPOSER_HOME" >> "$GITHUB_ENV"
      - name: Validate using the published composite action
        id: validate
        uses: shippercli/actions/.github/actions/shipper@2649f5132e10d405dddd77198e42c67035cfff4c
        with:
          command: validate
          working-directory: .github/actions/shipper/fixtures/tagged-providers
          cli-version: '1.0.6'
          providers: |
            shippercli/provider-forge:1.0.0
            shippercli/provider-ploi:2.0.0
            shippercli/provider-coolify:1.0.0
      - name: Verify the installed CLI and validation result
        env:
          VALIDATE_EXIT_CODE: ${{ steps.validate.outputs.exit-code }}
        run: |
          test "$VALIDATE_EXIT_CODE" = 0
          test "$(shipper --version)" = "Shipper 1.0.6"

  reusable-workflow:
    uses: ./.github/workflows/shipper.yml
    with:
      deploy: false
      project: app
      profile: production
      cpanel_hostname: cpanel.example.com
      working_directory: .github/actions/shipper/fixtures
      cli_version: '1.0.7'
      providers: |
        shippercli/provider-cpanel:1.2.3
        shippercli/provider-forge:1.0.0
        shippercli/provider-ploi:2.0.0
        shippercli/provider-coolify:1.0.9
    secrets:
      CPANEL_ACCOUNT_USERNAME: action-test
      CPANEL_API_TOKEN: action-test-token
