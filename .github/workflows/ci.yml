name: Composite Action CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test command argument boundaries
        run: ruby scripts/test-command-arguments.rb
      - name: Test organization CI health fixtures
        run: ./scripts/test-org-ci-health.sh
      - name: Validate reusable workflow contract
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          workflow = File.read('.github/workflows/shipper.yml')
          provider_secrets = %w[CPANEL_API_TOKEN FORGE_API_TOKEN PLOI_API_KEY]

          provider_secrets.each do |secret|
            declarations = workflow.scan(/^      #{secret}:$/).length
            environments = workflow.scan(/^          #{secret}: \$\{\{ secrets\.#{secret} \}\}$/).length
            raise "#{secret} must be declared exactly once" unless declarations == 1
            raise "#{secret} must be forwarded by all three jobs" unless environments == 3
          end

          pins = workflow.scan(%r{uses: shippercli/actions/\.github/actions/shipper@([^\s]+)}).flatten
          raise 'expected validate, plan, and deploy action invocations' unless pins.length == 3
          raise 'action references must use immutable 40-character SHAs' unless pins.all? { |pin| pin.match?(/\A[0-9a-f]{40}\z/) }
          workflow_data = YAML.load_file('.github/workflows/shipper.yml')
          callable = workflow_data.fetch(true).fetch('workflow_call')
          project = callable.fetch('inputs').fetch('project')
          raise 'reusable deployment workflow must require a project' unless project['required'] == true
          deploy = workflow_data.fetch('jobs').fetch('deploy')
          raise 'deployment must be restricted to the main branch' unless deploy['if'] == "github.ref == 'refs/heads/main'"
          RUBY
      - name: Install and validate with cPanel provider
        uses: ./.github/actions/shipper
        with:
          command: validate
          working-directory: .github/actions/shipper/fixtures
          cli-version: "^1.0"
          providers: |
            shippercli/provider-cpanel:^1.0
        env:
          CPANEL_USERNAME: action-test
          CPANEL_API_TOKEN: action-test-token
      - name: Verify CLI is available to subsequent steps
        run: shipper --version
