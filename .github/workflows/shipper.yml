name: Shipper Deploy

on:
  workflow_call:
    inputs:
      project:
        description: "Project to deploy"
        type: string
        required: false
      profile:
        description: "Profile to use"
        type: string
        required: false
      providers:
        description: "Provider Composer packages, one package and optional constraint per line"
        type: string
        required: true
      cli_version:
        description: "Composer constraint for shippercli/cli"
        type: string
        default: "^1.0"
      php_version:
        description: "PHP version used to install and run Shipper"
        type: string
        default: "8.3"
      working_directory:
        description: "Directory containing shipper.yml"
        type: string
        default: "."
    secrets:
      CPANEL_API_TOKEN:
        required: false
      FORGE_API_TOKEN:
        required: false
      CPANEL_API_TOKEN:
        required: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shippercli/actions/.github/actions/shipper@f31a980b0c6d51b531735d4cd68b2268ad54d193
        with:
          command: validate
          working-directory: ${{ inputs.working_directory }}
          php-version: ${{ inputs.php_version }}
          cli-version: ${{ inputs.cli_version }}
          providers: ${{ inputs.providers }}
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: shippercli/actions/.github/actions/shipper@f31a980b0c6d51b531735d4cd68b2268ad54d193
        with:
          command: plan
          project: ${{ inputs.project }}
          profile: ${{ inputs.profile }}
          working-directory: ${{ inputs.working_directory }}
          php-version: ${{ inputs.php_version }}
          cli-version: ${{ inputs.cli_version }}
          providers: ${{ inputs.providers }}
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: shippercli/actions/.github/actions/shipper@f31a980b0c6d51b531735d4cd68b2268ad54d193
        with:
          command: apply
          project: ${{ inputs.project }}
          profile: ${{ inputs.profile }}
          force: true
          working-directory: ${{ inputs.working_directory }}
          php-version: ${{ inputs.php_version }}
          cli-version: ${{ inputs.cli_version }}
          providers: ${{ inputs.providers }}
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
