name: Organization CI Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  health:
    name: Check required repository CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check latest required workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          failures=0
          checked=0
          printf '| Repository | Workflow | Latest conclusion | Updated |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| --- | --- | --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"

          while IFS=$'\t' read -r repository workflow; do
            checked=$((checked + 1))
            endpoint="https://api.github.com/repos/${repository}/actions/workflows/${workflow}/runs?per_page=1"
            response=$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$endpoint") || {
                printf '| `%s` | `%s` | API error | unavailable |\n' "$repository" "$workflow" >> "$GITHUB_STEP_SUMMARY"
                failures=$((failures + 1))
                continue
              }

            total=$(jq -r '.total_count' <<< "$response")
            if [ "$total" = '0' ]; then
              printf '| `%s` | `%s` | missing | unavailable |\n' "$repository" "$workflow" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
              continue
            fi

            conclusion=$(jq -r '.workflow_runs[0].conclusion // "in_progress"' <<< "$response")
            updated=$(jq -r '.workflow_runs[0].updated_at // "unknown"' <<< "$response")
            printf '| `%s` | `%s` | %s | %s |\n' "$repository" "$workflow" "$conclusion" "$updated" >> "$GITHUB_STEP_SUMMARY"
            if [ "$conclusion" != 'success' ]; then
              failures=$((failures + 1))
            fi
          done < <(jq -r '.[] | [.repository, .workflow] | @tsv' .github/org-ci-matrix.json)

          echo "Checked ${checked} repositories; failures: ${failures}."
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
