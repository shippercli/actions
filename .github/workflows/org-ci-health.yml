name: Organization CI Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  health:
    name: Check required repository CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check latest required workflows
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_CI_HEALTH_TOKEN }}
        run: |
          ./scripts/check-org-ci-health.sh .github/org-ci-matrix.json
